@if (auth.logoutMessage()) {
  <div style="position: fixed; top: 20px; right: 20px; z-index: 9999;" class="msg good">
    {{ auth.logoutMessage() }}
  </div>
}

<div class="shell">
  @if (auth.user()) {
    <aside class="noprint">
      <div class="brand" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
        <img src="logo.png" alt="SMS Logo" style="width: 42px; height: 42px; object-fit: contain; background: #ffffff; border-radius: 50%; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);" />
        <div>
          <small style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.75); display: block;">Secured Manpower Services</small>
        </div>
      </div>

      <nav class="menu">
        <a routerLink="/dashboard" routerLinkActive="on"><span>📊</span>Dashboard</a>
        <a routerLink="/inventory" routerLinkActive="on"><span>📦</span>Inventory</a>
        <a routerLink="/employees" routerLinkActive="on"><span>👥</span>Employees</a>
        <a routerLink="/distribution" routerLinkActive="on"><span>📦</span>Issue supplies</a>
        <a routerLink="/reports" routerLinkActive="on"><span>📈</span>Reports</a>
      </nav>

      <div class="spacer"></div>

      <div class="user">
        <div class="who">{{ auth.user()?.email }}</div>
        <button (click)="auth.logout()">Log out</button>
      </div>
    </aside>
  }

  <main class="page">
    <main class="page">
  <router-outlet />
</main>
